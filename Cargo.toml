[workspace]
resolver = "2"
members = ["crates/device", "crates/core", "crates/catalog", "crates/ec", "crates/sim", "crates/single-node"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1"
criterion = "0.5.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
unicode-normalization = "0.1"
